name: ci

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax, route parity and unit tests
        run: npm run check

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check lockfile
        id: lockfile
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "package-lock.json is not committed yet; dependency audit is skipped."
          fi
      - name: Install locked dependencies
        if: steps.lockfile.outputs.present == 'true'
        run: npm ci --ignore-scripts
      - name: Audit high severity vulnerabilities
        if: steps.lockfile.outputs.present == 'true'
        run: npm audit --audit-level=high
