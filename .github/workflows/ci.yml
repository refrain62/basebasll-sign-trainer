name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Require committed lockfile
        shell: bash
        run: |
          test -f package-lock.json || {
            echo "package-lock.json is required. Run: npm install --package-lock-only --ignore-scripts" >&2
            exit 1
          }
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: TypeScript, route parity, architecture and unit tests
        run: npm run check
      - name: Release policy diff guard
        if: github.event_name == 'pull_request'
        env:
          RELEASE_BASE_REF: origin/${{ github.base_ref }}
        run: npm run release:policy:ci
      - name: Release policy diff guard for direct pushes
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          RELEASE_BASE_REF: ${{ github.event.before }}
        run: npm run release:policy:ci
      - name: Audit high severity vulnerabilities
        run: npm audit --audit-level=high
