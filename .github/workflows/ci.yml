name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Require committed lockfile
        shell: bash
        run: |
          test -f package-lock.json || {
            echo "package-lock.json is required. Run: npm install --package-lock-only --ignore-scripts" >&2
            exit 1
          }
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: TypeScript, route parity, architecture and unit tests
        run: npm run check
      - name: Audit high severity vulnerabilities
        run: npm audit --audit-level=high
