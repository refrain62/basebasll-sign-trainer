<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#082844" />
    <meta name="description" content="SIGN TRAINERは、チームの野球サインを動画でくり返し練習するシンプルなWebアプリです。" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="サイントレーナー | 野球のサイン練習" />
    <meta property="og:description" content="見て、覚えて、迷わず動く。チームのサインを動画でくり返し練習。" />
    <meta property="og:image" content="/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>SIGN TRAINER | 野球のサイン練習</title>
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-48.png" sizes="48x48" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/styles.css?v=21" />
  </head>
  <body>
    <div id="app" aria-live="polite"></div>

    <dialog id="confirm-dialog" class="dialog" aria-labelledby="confirm-title">
      <form method="dialog" class="dialog-card">
        <div class="dialog-icon dialog-icon-danger" aria-hidden="true">↪</div>
        <h2 id="confirm-title">練習を終了しますか？</h2>
        <p>ここまでの進み具合は保存されません。</p>
        <div class="dialog-actions">
          <button value="confirm" class="button button-danger">終了する</button>
          <button value="cancel" class="button button-secondary">キャンセル</button>
        </div>
      </form>
    </dialog>

    <dialog id="logout-dialog" class="dialog" aria-labelledby="logout-title">
      <form method="dialog" class="dialog-card">
        <div class="dialog-icon" aria-hidden="true">⌁</div>
        <h2 id="logout-title">この端末の認証を解除しますか？</h2>
        <p>次回このチームページを開いたとき、合言葉の入力が必要になります。</p>
        <div class="dialog-actions">
          <button value="confirm" class="button button-danger">認証を解除する</button>
          <button value="cancel" class="button button-secondary">キャンセル</button>
        </div>
      </form>
    </dialog>

    <script src="/app.js?v=21" type="module"></script>
  </body>
</html>
